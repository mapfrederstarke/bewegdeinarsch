<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Workout Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 40px;
        }
        h1 { font-size: 40px; margin-bottom: 20px; }
        #exercise { font-size: 32px; margin: 20px 0; }
        #timer { font-size: 60px; margin: 30px 0; }
        #phase { font-size: 24px; margin-top: 10px; color: #0f0; }
        #total { font-size: 20px; margin-top: 20px; opacity: 0.7; }
    </style>
</head>
<body>

    <h1>Workout Timer</h1>

    <div id="exercise"></div>
    <div id="phase"></div>
    <div id="timer"></div>
    <div id="total"></div>

    <script>
        let exercises = [
            "Kniebeugen",
            "Liegestütze",
            "Plank",
            "Ausfallschritte",
            "Burpees",
            "Crunches",
            "Mountain Climbers",
            "Hampelmänner",
            "Russian Twist",
            "High Knees"
        ];

        let current = 0;
        let phase = "work"; // "work" = 40 Sek., "rest" = 20 Sek.
        let timeLeft = 40;
        let timerInterval;

        function updateUI() {
            if (phase === "work") {
                document.getElementById("exercise").innerText = exercises[current];
                document.getElementById("phase").innerText = "40 Sekunden";
            } else {
                document.getElementById("exercise").innerText = "Pause";
                document.getElementById("phase").innerText = "20 Sekunden";
            }

            document.getElementById("timer").innerText = timeLeft;
            document.getElementById("total").innerText =
                "Übung " + (current + 1) + " von " + exercises.length;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextPhase();
                }
            }, 1000);
        }

        function nextPhase() {
            if (phase === "work") {
                // Nach 40 Sekunden → Pause
                phase = "rest";
                timeLeft = 20;
            } else {
                // Pause vorbei → nächste Übung
                current++;
                if (current >= exercises.length) {
                    document.getElementById("exercise").innerText = "FERTIG!";
                    document.getElementById("phase").innerText = "";
                    document.getElementById("timer").innerText = "0";
                    document.getElementById("total").innerText = "Alle Übungen abgeschlossen";
                    return;
                }
                phase = "work";
                timeLeft = 40;
            }

            updateUI();
            startTimer();
        }

        // Start
        updateUI();
        startTimer();
    </script>

</body>
</html>
