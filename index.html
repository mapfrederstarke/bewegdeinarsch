<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Workout Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }
        #exercise {
            font-size: 32px;
            margin: 20px 0;
        }
        #timer {
            font-size: 60px;
            margin: 30px 0;
        }
        #total {
            font-size: 20px;
            margin-top: 20px;
            opacity: 0.7;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #28a745;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #1e7e34;
        }
    </style>
</head>
<body>

    <h1>Workout Timer</h1>

    <div id="exercise">Übung: Kniebeugen</div>

    <div id="timer">30</div>

    <button onclick="nextExercise()">Weiter zur nächsten Übung</button>

    <div id="total">Übung 1 von 5</div>

    <script>
        let exercises = [
            "Kniebeugen",
            "Liegestütze",
            "Plank",
            "Ausfallschritte",
            "Burpees"
        ];

        let current = 0;
        let timeLeft = 30;
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function nextExercise() {
            clearInterval(timerInterval);

            current++;
            if (current >= exercises.length) {
                document.getElementById("exercise").innerText = "FERTIG!";
                document.getElementById("timer").innerText = "0";
                document.getElementById("total").innerText = "Alle Übungen abgeschlossen";
                return;
            }

            document.getElementById("exercise").innerText = "Übung: " + exercises[current];
            document.getElementById("total").innerText = "Übung " + (current + 1) + " von " + exercises.length;

            timeLeft = 30;
            document.getElementById("timer").innerText = timeLeft;

            startTimer();
        }

        startTimer();
    </script>

</body>
</html>
