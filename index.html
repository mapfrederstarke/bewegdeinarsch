<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Workout Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 40px;
        }
        h1 { font-size: 40px; margin-bottom: 20px; }
        #exercise { font-size: 32px; margin: 20px 0; }
        #timer { font-size: 60px; margin: 30px 0; }
        #phase { font-size: 24px; margin-top: 10px; color: #0f0; }
        #total { font-size: 20px; margin-top: 20px; opacity: 0.7; }
        #countdown { font-size: 80px; color: #ff0; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Workout Timer</h1>

    <audio id="beep">
        <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
    </audio>

    <div id="exercise"></div>
    <div id="phase"></div>
    <div id="timer"></div>
    <div id="countdown"></div>
    <div id="total"></div>

    <script>
        let exercises = [
            "Liegestütz",
            "Kniebeugen",
            "Plank",
            "Ausfallschritte",
            "Burpees",
            "Crunches",
            "Mountain Climbers",
            "Hampelmänner",
            "Russian Twist",
            "High Knees"
        ];

        let current = 0;
        let phase = "countdown"; // Start mit Countdown
        let timeLeft = 3;
        let timerInterval;

        const beep = document.getElementById("beep");

        function updateUI() {
            if (phase === "countdown") {
                document.getElementById("exercise").innerText = exercises[current];
                document.getElementById("phase").innerText = "Bereit machen!";
                document.getElementById("timer").innerText = "";
                document.getElementById("countdown").innerText = timeLeft;
                return;
            }

            document.getElementById("countdown").innerText = "";

            if (phase === "work") {
                document.getElementById("exercise").innerText = exercises[current];
                document.getElementById("phase").innerText = "40 Sekunden";
            } else if (phase === "rest") {
                let next = current + 1;
                if (next < exercises.length) {
                    document.getElementById("exercise").innerText = exercises[next];
                } else {
                    document.getElementById("exercise").innerText = "FERTIG!";
                }
                document.getElementById("phase").innerText = "20 Sekunden Pause";
            }

            document.getElementById("timer").innerText = timeLeft;
            document.getElementById("total").innerText =
                "Übung " + (current + 1) + " von " + exercises.length;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;

                if (phase === "countdown") {
                    document.getElementById("countdown").innerText = timeLeft;
                } else {
                    document.getElementById("timer").innerText = timeLeft;
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    beep.play();
                    nextPhase();
                }
            }, 1000);
        }

        function nextPhase() {
            if (phase === "countdown") {
                phase = "work";
                timeLeft = 40;
            }
            else if (phase === "work") {
                phase = "rest";
                timeLeft = 20;
            }
            else if (phase === "rest") {
                current++;
                if (current >= exercises.length) {
                    document.getElementById("exercise").innerText = "FERTIG!";
                    document.getElementById("phase").innerText = "";
                    document.getElementById("timer").innerText = "0";
                    return;
                }
                phase = "countdown";
                timeLeft = 3;
            }

            updateUI();
            startTimer();
        }

        // Start
        updateUI();
        startTimer();
    </script>

</body>
</html>
